<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>פעילות היכרות קצרצרה</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172b46;font-family:system-ui,Arial,sans-serif}main{max-width:1080px;margin:auto;padding:40px 24px}header{text-align:center}.eyebrow{color:#536b87;font-weight:700}h1{font-size:clamp(2rem,5vw,3rem);margin:12px 0}header p{color:#536b87;line-height:1.8}.panel{background:white;border:1px solid #dfe7f2;border-radius:22px;padding:24px;margin:28px auto;max-width:650px;text-align:center;box-shadow:0 8px 28px #172b4608}.timer{font-size:clamp(3rem,9vw,5rem);font-weight:750;font-variant-numeric:tabular-nums;direction:ltr;color:#215cc4;line-height:1.2;margin:16px}.timer.warning{color:#b45309}.timer.finished{color:#b42318}button,select{font:inherit}button{cursor:pointer;border-radius:11px;padding:12px 20px;border:1px solid #cdd9ea;background:#fff;color:#203a5c;font-weight:650}button:hover{background:#edf3ff}button:focus-visible,select:focus-visible{outline:3px solid #e5a932;outline-offset:4px}.primary{background:#215cc4;color:white;border-color:#215cc4}.primary:hover{background:#174caa}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}select{margin-inline-start:8px;border:1px solid #cdd9ea;border-radius:8px;padding:8px;background:#fff;color:#172b46}.status{min-height:1.5em;color:#536b87;margin:12px 0 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:24px 0}.card{min-height:240px;border:1px solid #d8e4f4;background:white;border-radius:20px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:1.2rem;line-height:1.7;box-shadow:0 8px 24px #172b4608;transition:transform .18s,background .18s}.card:hover{transform:translateY(-4px)}.card.revealed{background:#e8f2ff;border-color:#a8c8ed;color:#194b82}.icon{font-size:2rem}.hint{font-size:.85rem;font-weight:400;color:#536b87}.bottom{text-align:center}.bottom p{color:#536b87;font-size:.9rem}@media(max-width:700px){main{padding:24px 16px}.grid{grid-template-columns:1fr}.card{min-height:180px}.panel{padding:20px 12px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style></head>
<body><main><header><div class="eyebrow">שלושה קלפים · הזדמנות להכיר</div><h1>🎲 פעילות היכרות קצרצרה</h1><p>בחרו קלף, חשפו את השאלה ושתפו בתשובה.<br>לחיצה נוספת סוגרת את הקלף.</p></header>
<section class="panel" aria-label="טיימר הפעילות"><label for="duration">משך הפעילות</label><select id="duration"><option value="180">3 דקות</option><option value="300">5 דקות</option><option value="600" selected>10 דקות</option><option value="900">15 דקות</option></select><div id="timerDisplay" class="timer" role="timer" aria-label="זמן שנותר">10:00</div><div class="controls"><button class="primary" id="toggleTimer">התחלת הטיימר</button><button id="resetTimer">איפוס הטיימר</button></div><p class="status" id="timerStatus" role="status">מוכנים להתחיל</p></section>
<div class="grid" id="cards" aria-label="קלפי היכרות"></div><div class="bottom"><button id="resetCards">סגירת כל הקלפים</button><p>אפשר לבחור את הקלפים בכל סדר. היישומון עובד גם ללא אינטרנט.</p></div></main>
<script>
'use strict';
const questions=["✨ מה הניצוץ שגרם לך לבחור בתחום הטיפול בלקויות למידה?","🎯 למה את/ה הכי מחכה השנה בלימודים או בפרקטיקום?","🎒 אם היית צריך לתאר את חוויית בית הספר שלך כילד באימוג'י אחד, מה הוא היה?"];
const cards=document.getElementById('cards');
questions.forEach((question,index)=>{const card=document.createElement('button');card.type='button';card.className='card';card.dataset.index=index;card.setAttribute('aria-pressed','false');card.addEventListener('click',()=>setCard(card,!card.classList.contains('revealed')));setCard(card,false);cards.append(card)});
function setCard(card,open){card.classList.toggle('revealed',open);card.setAttribute('aria-pressed',String(open));card.replaceChildren();const content=document.createElement('span');content.textContent=open?questions[Number(card.dataset.index)]:`❓ קלף ${Number(card.dataset.index)+1}`;card.append(content);const hint=document.createElement('span');hint.className='hint';hint.textContent=open?'לחצו לסגירה':'לחצו לגילוי השאלה';card.append(hint)}
document.getElementById('resetCards').addEventListener('click',()=>cards.querySelectorAll('.card').forEach(card=>setCard(card,false)));
const display=document.getElementById('timerDisplay'),toggle=document.getElementById('toggleTimer'),status=document.getElementById('timerStatus'),duration=document.getElementById('duration');
let remaining=Number(duration.value)*1000,deadline=0,interval=null,running=false;
function render(){const seconds=Math.ceil(remaining/1000);display.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`;display.classList.toggle('warning',seconds>0&&seconds<=60);display.classList.toggle('finished',seconds===0)}
function stop(){clearInterval(interval);interval=null;running=false}
function tick(){remaining=Math.max(0,deadline-Date.now());render();if(remaining===0){stop();toggle.textContent='התחלה מחדש';status.textContent='הזמן הסתיים — אפשר לסיים את השיתוף הנוכחי'}}
function reset(){stop();remaining=Number(duration.value)*1000;render();toggle.textContent='התחלת הטיימר';status.textContent='מוכנים להתחיל'}
toggle.addEventListener('click',()=>{if(running){tick();if(remaining===0)return;stop();toggle.textContent='המשך הטיימר';status.textContent='הטיימר מושהה'}else{if(remaining===0)remaining=Number(duration.value)*1000;deadline=Date.now()+remaining;running=true;toggle.textContent='השהיית הטיימר';status.textContent='הפעילות בעיצומה';tick();interval=setInterval(tick,100)}});
document.getElementById('resetTimer').addEventListener('click',reset);duration.addEventListener('change',reset);document.addEventListener('visibilitychange',()=>{if(running)tick()});render();
